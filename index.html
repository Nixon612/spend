<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#18181b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spend">
<meta name="mobile-web-app-capable" content="yes">
<title>Spend</title>
<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --dark: #18181b;
    --ink: #18181b;
    --muted: #71717a;
    --border: #e4e4e7;
    --soft: #fafafa;
    --danger: #ef4444;
    --good: #10b981;
    --radius: 14px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select { font: inherit; color: inherit; border: none; background: none; outline: none; width: 100%; }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; padding-bottom: 60px; }

  .install-tip {
    display: flex; align-items: center; gap: 10px;
    background: var(--dark); color: #fff;
    padding: 11px 14px; border-radius: var(--radius-sm); margin-bottom: 12px; font-size: 13px;
  }
  .install-tip[hidden] { display: none; }
  .install-tip span { flex: 1; }
  .install-tip button {
    padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500;
    background: rgba(255,255,255,0.15); color: #fff; transition: background 0.15s;
  }
  .install-tip button:hover { background: rgba(255,255,255,0.25); }
  .install-tip button[hidden] { display: none; }
  .install-tip .install-x { padding: 4px 8px; font-size: 16px; background: none; opacity: 0.7; }
  .install-tip .install-x:hover { opacity: 1; background: none; }

  .export-nudge {
    display: flex; align-items: center; gap: 10px;
    background: var(--card); color: var(--ink);
    border: 1px solid var(--border);
    padding: 11px 14px; border-radius: var(--radius-sm);
    margin-bottom: 12px; font-size: 13px;
  }
  .export-nudge[hidden] { display: none; }
  .export-nudge span { flex: 1; color: var(--muted); }
  .export-nudge span strong { color: var(--ink); font-weight: 500; }
  .export-nudge button {
    padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: 500;
    background: var(--dark); color: #fff; transition: opacity 0.15s;
  }
  .export-nudge button:hover { opacity: 0.9; }
  .export-nudge .export-x {
    padding: 4px 8px; font-size: 16px; background: none; color: var(--muted);
    opacity: 0.7;
  }
  .export-nudge .export-x:hover { opacity: 1; background: none; }

  .header {
    background: var(--dark); color: #fff;
    border-radius: var(--radius); padding: 20px 20px 18px; margin-bottom: 14px;
  }
  .month-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
  .month { font-size: 13px; color: rgba(255,255,255,0.6); letter-spacing: 0.02em; }
  .gear {
    color: rgba(255,255,255,0.6); padding: 4px; border-radius: 6px;
    font-size: 16px; line-height: 1;
  }
  .gear:hover { color: #fff; background: rgba(255,255,255,0.08); }
  .remaining-amount { font-size: 40px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .remaining-amount .cur { font-size: 28px; font-weight: 500; opacity: 0.7; margin-right: 2px; }
  .remaining-label { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 4px; }
  .progress { height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 18px 0 14px; overflow: hidden; }
  .progress-fill { height: 100%; background: #fff; border-radius: 2px; transition: width 0.35s ease, background 0.2s; }
  .progress-fill.over { background: var(--danger); }
  .safe-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .safe-amount { color: #fff; font-weight: 600; }
  .safe-label { color: rgba(255,255,255,0.55); }
  .today-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; margin-top: 6px; }
  .today-label { color: rgba(255,255,255,0.55); }
  .today-amount { color: rgba(255,255,255,0.9); }
  .wallet-mini {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 13px; margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.1);
    cursor: pointer; user-select: none;
  }
  .wallet-mini:hover .wallet-mini-amount { opacity: 1; }
  .wallet-mini-label { color: rgba(255,255,255,0.55); }
  .wallet-mini-amount { color: rgba(255,255,255,0.9); font-weight: 500; opacity: 0.85; }

  .tabs {
    display: flex; gap: 4px; background: var(--card); padding: 4px;
    border-radius: var(--radius-sm); margin-bottom: 14px; border: 1px solid var(--border);
  }
  .tab {
    flex: 1; padding: 8px 4px; border-radius: 7px; font-size: 12px;
    color: var(--muted); font-weight: 500; transition: background 0.15s, color 0.15s;
    white-space: nowrap;
  }
  .tab.active { background: var(--dark); color: #fff; }

  .add-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px; margin-bottom: 16px;
  }
  .amount-row {
    display: flex; align-items: baseline; gap: 4px;
    padding: 8px 4px 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px;
  }
  .amount-row .cur { font-size: 26px; color: var(--muted); font-weight: 500; }
  #amountInput { font-size: 34px; font-weight: 600; letter-spacing: -0.02em; padding: 0; line-height: 1.1; }
  #amountInput::placeholder { color: #d4d4d8; }
  .categories { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cat {
    padding: 7px 12px; border-radius: 999px; font-size: 13px;
    background: var(--soft); color: var(--ink); border: 1px solid var(--border);
    transition: background 0.12s, border-color 0.12s, color 0.12s; white-space: nowrap;
  }
  .cat:hover { background: #f0f0f1; }
  .cat.active { color: #fff; border-color: transparent; }
  .cat.active[data-cat="Food"] { background: #f59e0b; }
  .cat.active[data-cat="Eating out"] { background: #f87171; }
  .cat.active[data-cat="Transport"] { background: #60a5fa; }
  .cat.active[data-cat="Rent"] { background: #a78bfa; }
  .cat.active[data-cat="Books"] { background: #34d399; }
  .cat.active[data-cat="Going out"] { background: #f472b6; }
  .cat.active[data-cat="Subscriptions"] { background: #818cf8; }
  .cat.active[data-cat="Phone"] { background: #22d3ee; }
  .cat.active[data-cat="Other"] { background: #71717a; }
  .note-row { padding: 10px 4px; border-top: 1px solid var(--border); }
  #noteInput { font-size: 14px; }
  #noteInput::placeholder { color: #a1a1aa; }
  .split-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px; border-top: 1px solid var(--border);
    font-size: 14px; color: var(--muted); flex-wrap: wrap;
  }
  .split-row label { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
  .split-row input[type=checkbox] { width: 16px; height: 16px; margin: 0; accent-color: var(--dark); }
  #splitCount {
    width: 56px; padding: 6px 8px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--soft); font-size: 14px; text-align: center;
  }
  .split-info { font-size: 13px; color: var(--ink); font-weight: 500; margin-left: auto; }
  .add-btn {
    width: 100%; padding: 14px; margin-top: 12px;
    background: var(--dark); color: #fff; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600; transition: opacity 0.15s, transform 0.08s;
  }
  .add-btn:disabled { opacity: 0.35; cursor: default; }
  .add-btn:not(:disabled):active { transform: scale(0.99); }

  .day-group { margin-bottom: 18px; }
  .day-label {
    font-size: 12px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em; padding: 0 4px 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .day-total { color: var(--muted); letter-spacing: 0; text-transform: none; font-size: 13px; }
  .expenses-list {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .exp {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--border); position: relative;
  }
  .exp:last-child { border-bottom: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .exp-body { flex: 1; min-width: 0; }
  .exp-cat { font-size: 14px; font-weight: 500; color: var(--ink); }
  .exp-note {
    font-size: 13px; color: var(--muted); margin-top: 1px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .exp-amount { font-size: 15px; font-weight: 500; color: var(--ink); flex-shrink: 0; }
  .exp-amount.pos { color: var(--good); }
  .exp-amount.neg { color: var(--danger); }
  .exp-delete {
    color: #d4d4d8; font-size: 18px; line-height: 1;
    padding: 4px 6px; margin-right: -6px; border-radius: 6px;
    opacity: 0; transition: opacity 0.15s, color 0.15s;
  }
  .exp:hover .exp-delete { opacity: 1; }
  .exp-delete:hover { color: var(--danger); }
  @media (hover: none) { .exp-delete { opacity: 1; color: #a1a1aa; } }

  .breakdown {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 16px;
  }
  .bd-title {
    font-size: 13px; color: var(--muted); text-transform: uppercase;
    letter-spacing: 0.06em; margin-bottom: 14px;
  }
  .stack { height: 10px; border-radius: 5px; overflow: hidden; display: flex; background: var(--soft); margin-bottom: 16px; }
  .stack-seg { height: 100%; }
  .bd-rows { display: flex; flex-direction: column; gap: 10px; }
  .bd-row { display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .bd-row .dot { width: 8px; height: 8px; }
  .bd-name { flex: 1; }
  .bd-pct { color: var(--muted); font-size: 13px; min-width: 42px; text-align: right; }
  .bd-amt { font-weight: 500; min-width: 72px; text-align: right; }

  .bucket-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }
  .bucket-stack {
    height: 12px; border-radius: 6px; overflow: hidden;
    display: flex; background: var(--soft); margin-bottom: 18px;
  }
  .bucket-row {
    display: flex; align-items: center; gap: 10px;
    font-size: 14px; padding: 9px 0; border-bottom: 1px solid var(--border);
  }
  .bucket-row:last-child { border-bottom: none; }
  .bucket-row .dot { width: 8px; height: 8px; flex-shrink: 0; }
  .bucket-name { flex: 1; }
  .bucket-pct { color: var(--muted); font-size: 13px; min-width: 42px; text-align: right; }
  .bucket-amt { font-weight: 500; min-width: 76px; text-align: right; }
  .bucket-adjust {
    color: #d4d4d8; font-size: 16px; line-height: 1;
    padding: 4px 6px; border-radius: 6px; font-weight: 400;
    transition: color 0.15s, background 0.15s; min-width: 30px; text-align: right;
  }
  .bucket-row:hover .bucket-adjust { color: var(--muted); }
  .bucket-adjust:hover { color: var(--ink); background: var(--soft); }
  .bucket-total {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-top: 14px; margin-top: 6px; border-top: 1px solid var(--border);
    font-size: 15px; font-weight: 600;
  }
  .bucket-note { font-size: 13px; color: var(--muted); padding: 0 4px; margin-top: -6px; margin-bottom: 14px; line-height: 1.5; }

  .wallet-card {
    background: var(--dark); color: #fff;
    border-radius: var(--radius); padding: 22px 20px 18px; margin-bottom: 16px;
  }
  .wallet-label { font-size: 13px; color: rgba(255,255,255,0.55); letter-spacing: 0.02em; }
  .wallet-balance {
    font-size: 42px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin: 4px 0 4px;
  }
  .wallet-balance .cur { font-size: 28px; font-weight: 500; opacity: 0.7; margin-right: 2px; }
  .wallet-sub { font-size: 13px; color: rgba(255,255,255,0.55); }
  .wallet-actions { display: flex; gap: 8px; margin-top: 18px; }
  .wallet-actions button {
    flex: 1; padding: 11px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500; transition: background 0.15s;
  }
  .wallet-actions .primary { background: #fff; color: var(--dark); }
  .wallet-actions .primary:hover { background: rgba(255,255,255,0.9); }
  .wallet-actions .secondary { background: rgba(255,255,255,0.12); color: #fff; }
  .wallet-actions .secondary:hover { background: rgba(255,255,255,0.2); }

  .wallet-stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .wallet-stat {
    flex: 1; background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
  }
  .wallet-stat-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .wallet-stat-value { font-size: 18px; font-weight: 600; margin-top: 4px; }

  .week-card {
    background: var(--dark); color: #fff;
    border-radius: var(--radius); padding: 22px 20px 18px; margin-bottom: 16px;
  }
  .week-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 14px; }
  .week-label { font-size: 13px; color: rgba(255,255,255,0.55); }
  .week-range { font-size: 12px; color: rgba(255,255,255,0.45); }
  .week-amount { font-size: 38px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
  .week-amount .cur { font-size: 26px; font-weight: 500; opacity: 0.7; margin-right: 2px; }
  .week-sub { font-size: 13px; color: rgba(255,255,255,0.55); margin-top: 4px; }
  .week-progress { height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; margin: 18px 0 14px; overflow: hidden; }
  .week-progress-fill { height: 100%; background: #fff; border-radius: 2px; transition: width 0.35s ease; }
  .week-progress-fill.over { background: var(--danger); }
  .week-meta { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
  .week-meta-label { color: rgba(255,255,255,0.55); }
  .week-meta-value { color: rgba(255,255,255,0.9); font-weight: 500; }

  .week-days {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .week-day {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 14px; border-bottom: 1px solid var(--border);
  }
  .week-day:last-child { border-bottom: none; }
  .week-day.today { background: var(--soft); }
  .week-day-name { font-size: 14px; font-weight: 500; width: 44px; }
  .week-day.today .week-day-name { color: var(--dark); }
  .week-day-bar {
    flex: 1; height: 6px; background: var(--soft);
    border-radius: 3px; overflow: hidden; position: relative;
  }
  .week-day.today .week-day-bar { background: rgba(0,0,0,0.06); }
  .week-day-bar-fill { height: 100%; background: var(--dark); border-radius: 3px; }
  .week-day-amt { font-size: 13px; color: var(--muted); width: 56px; text-align: right; }
  .week-day.today .week-day-amt { color: var(--ink); font-weight: 500; }

  .empty { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 14px; font-style: italic; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(24,24,27,0.5);
    display: none; align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--card); border-radius: var(--radius);
    padding: 22px; width: 100%; max-width: 380px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2); max-height: 90vh; overflow-y: auto;
  }
  .modal-title { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
  .modal-sub { font-size: 13px; color: var(--muted); margin: 0 0 18px; line-height: 1.5; }
  .field { margin-bottom: 14px; }
  .field label {
    display: block; font-size: 12px; color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px;
  }
  .field input, .field select {
    padding: 11px 12px; background: var(--soft); border: 1px solid var(--border);
    border-radius: 8px; font-size: 15px; width: 100%;
  }
  .field input:focus, .field select:focus { border-color: var(--dark); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }
  .field-hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.4; }
  .allocation-summary {
    padding: 10px 12px; background: var(--soft); border-radius: 8px;
    font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5;
  }
  .allocation-summary .over { color: var(--danger); font-weight: 500; }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .modal-actions button {
    flex: 1; padding: 11px; border-radius: 8px;
    font-size: 14px; font-weight: 500;
    border: 1px solid var(--border); color: var(--muted);
  }
  .modal-actions button.primary { background: var(--dark); color: #fff; border-color: var(--dark); }
  .modal-actions button.danger { color: var(--danger); border-color: var(--border); }
  .modal-actions button:hover:not(.primary):not(.danger) { background: var(--soft); }
  .modal-actions button.danger:hover { background: #fef2f2; }
  .modal-actions.three { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .modal-actions.three button:first-child { grid-column: 1 / -1; }

  .welcome {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 22px; margin-bottom: 16px; text-align: center;
  }
  .welcome h2 { margin: 0 0 6px; font-size: 17px; font-weight: 600; }
  .welcome p { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
  .welcome .field { text-align: left; }
</style>
</head>
<body>

<div class="app">
  <div class="install-tip" id="installTip" hidden>
    <span id="installText">Install Spend for offline access</span>
    <button id="installBtn">Install</button>
    <button class="install-x" id="installDismiss" aria-label="Dismiss">&#215;</button>
  </div>

  <div class="export-nudge" id="exportNudge" hidden>
    <span><strong>Back up your data.</strong> Your entries live only in this browser.</span>
    <button id="exportNudgeOpen">Export</button>
    <button class="export-x" id="exportNudgeDismiss" aria-label="Dismiss">&#215;</button>
  </div>

  <div class="header" id="header"></div>

  <div class="tabs" id="tabsBar"></div>

  <div id="spendTab">
    <div id="welcomeSlot"></div>
    <div class="add-card" id="addCard">
      <div class="amount-row">
        <span class="cur" id="curSymbol">&#8377;</span>
        <input type="text" inputmode="decimal" id="amountInput" placeholder="0" autocomplete="off">
      </div>
      <div class="categories" id="categories"></div>
      <div class="note-row">
        <input type="text" id="noteInput" placeholder="Note (optional)" autocomplete="off">
      </div>
      <div class="split-row">
        <label>
          <input type="checkbox" id="splitToggle">
          Split with others
        </label>
        <input type="number" id="splitCount" min="2" max="50" value="2" hidden>
        <span class="split-info" id="splitInfo" hidden></span>
      </div>
      <button class="add-btn" id="addBtn" disabled>Add</button>
    </div>
    <div id="expenseList"></div>
  </div>

  <div id="weekTab" hidden></div>

  <div id="monthTab" hidden>
    <div class="breakdown" id="breakdown"></div>
    <div id="monthExpenses"></div>
  </div>

  <div id="asideTab" hidden>
    <div id="asideContent"></div>
  </div>

  <div id="walletTab" hidden></div>
</div>

<div class="modal-bg" id="settingsModal">
  <div class="modal" id="settingsBody"></div>
</div>

<div class="modal-bg" id="adjustModal">
  <div class="modal" id="adjustBody"></div>
</div>

<div class="modal-bg" id="walletModal">
  <div class="modal" id="walletBody"></div>
</div>

<script>
// ============ Safe storage ============
const Store = (function() {
  var mem = {};
  var ok = false;
  try {
    var probe = '__spend_probe__';
    window.localStorage.setItem(probe, '1');
    window.localStorage.removeItem(probe);
    ok = true;
  } catch (e) { ok = false; }
  return {
    available: ok,
    get: function(k) {
      try { return ok ? window.localStorage.getItem(k) : (mem[k] || null); }
      catch (e) { return mem[k] || null; }
    },
    set: function(k, v) {
      try { if (ok) window.localStorage.setItem(k, v); else mem[k] = v; }
      catch (e) { mem[k] = v; }
    },
    remove: function(k) {
      try { if (ok) window.localStorage.removeItem(k); else delete mem[k]; }
      catch (e) { delete mem[k]; }
    }
  };
})();

// ============ Constants ============

// ============ Storage ============
function load() {
  try { expenses = JSON.parse(Store.get(EXP_KEY)) || []; }
  catch (e) { expenses = []; }
  try {
    const c = JSON.parse(Store.get(CFG_KEY));
    if (c && typeof c === 'object') {
      config = Object.assign({}, DEFAULT_CONFIG, c);
      config.allocations = Object.assign({}, DEFAULT_CONFIG.allocations, c.allocations || {});
      config.totals = Object.assign({}, DEFAULT_CONFIG.totals, c.totals || {});
      if (!Array.isArray(config.wallet)) config.wallet = [];
      if (typeof config.weeklyBudget !== 'number') config.weeklyBudget = 0;
    }
  } catch (e) {}
  lastCategory = Store.get(LASTCAT_KEY) || 'Food';
  selectedCategory = lastCategory;
}

// ============ Month / week helpers ============
function monthKey(d) {
  d = d || new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function startOfWeek(d) {
  d = d ? new Date(d) : new Date();
  d.setHours(0, 0, 0, 0);
  const day = d.getDay();
  const target = config.weekStartsMonday ? 1 : 0;
  const diff = (day - target + 7) % 7;
  d.setDate(d.getDate() - diff);
  return d;
}
function endOfWeek(d) {
  const s = startOfWeek(d);
  const e = new Date(s);
  e.setDate(e.getDate() + 6);
  e.setHours(23, 59, 59, 999);
  return e;
}
function rollMonth() {
  const current = monthKey();
  if (!config.lastRolledMonth) {
    config.lastRolledMonth = current;
    saveConfig();
    return;
  }
  if (config.lastRolledMonth === current) return;
  const parts = config.lastRolledMonth.split('-');
  const ly = Number(parts[0]);
  const lm = Number(parts[1]);
  const cparts = current.split('-');
  const cy = Number(cparts[0]);
  const cm = Number(cparts[1]);
  const monthsDiff = (cy - ly) * 12 + (cm - lm);
  if (monthsDiff <= 0) {
    config.lastRolledMonth = current;
    saveConfig();
    return;
  }
  const a = config.allocations || {};
  const monthly = {
    emergency: config.budget * (a.emergency || 0) / 100,
    savings:   config.budget * (a.savings   || 0) / 100,
    buffer:    config.budget * (a.buffer    || 0) / 100
  };
  ['emergency','savings','buffer'].forEach(function(k) {
    config.totals[k] = (config.totals[k] || 0) + monthly[k] * monthsDiff;
  });
  config.lastRolledMonth = current;
  saveConfig();
}

// ============ Helpers ============
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function fmt(n) { return Math.round(n).toLocaleString(config.locale); }
function effectiveAmount(e) { return e.amount / (e.split || 1); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear()
    && a.getMonth() === b.getMonth()
    && a.getDate() === b.getDate();
}
function dayLabel(date) {
  const today = new Date();
  const yesterday = new Date();
  yesterday.setDate(today.getDate() - 1);
  if (sameDay(date, today)) return 'Today';
  if (sameDay(date, yesterday)) return 'Yesterday';
  return date.toLocaleDateString(config.locale, {
    weekday: 'long', month: 'short', day: 'numeric'
  });
}
function bucketColor(key) {
  const b = BUCKETS.find(function(x) { return x.key === key; });
  return b ? b.color : '#71717a';
}
function bucketName(key) {
  const b = BUCKETS.find(function(x) { return x.key === key; });
  return b ? b.name : key;
}

// ============ Wallet & allotments ============
function walletBalance() {
  return (config.wallet || []).reduce(function(s, t) {
    if (t.type === 'in') return s + t.amount;
    if (t.type === 'out') return s - t.amount;
    if (t.type === 'allot') return s - t.amount;
    if (t.type === 'refund') return s + t.amount;
    return s;
  }, 0);
}
function walletAllottedToMonth(mk) {
  return (config.wallet || [])
    .filter(function(t) { return t.type === 'allot' && t.month === mk; })
    .reduce(function(s, t) { return s + t.amount; }, 0)
    - (config.wallet || [])
    .filter(function(t) { return t.type === 'refund' && t.month === mk; })
    .reduce(function(s, t) { return s + t.amount; }, 0);
}
function budgetForMonth(mk) {
  return config.budget + walletAllottedToMonth(mk);
}

// ============ Weekly budget resolution ============
function resolveWeeklyBudget() {
  const m = getMonthData();
  if (config.weeklyBudget > 0) {
    return { amount: config.weeklyBudget, source: 'set', monthData: m };
  }
  const daysInMonth = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).getDate();
  return {
    amount: m.spendingBudget * (7 / daysInMonth),
    source: 'derived',
    monthData: m
  };
}

// ============ Budget math ============
function getAllocationAmounts(monthBudget) {
  const a = config.allocations || { emergency: 0, savings: 0, buffer: 0 };
  const b = monthBudget != null ? monthBudget : config.budget;
  return {
    emergency: b * (a.emergency || 0) / 100,
    savings:   b * (a.savings   || 0) / 100,
    buffer:    b * (a.buffer    || 0) / 100,
    percent:   (a.emergency || 0) + (a.savings || 0) + (a.buffer || 0)
  };
}
function getMonthData() {
  const now = new Date();
  const mk = monthKey(now);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const daysLeft = daysInMonth - now.getDate() + 1;

  const monthExpenses = expenses.filter(function(e) {
    const d = new Date(e.created);
    return d >= monthStart && d < monthEnd;
  });

  const monthBudget = budgetForMonth(mk);
  const alloc = getAllocationAmounts(monthBudget);
  const spendingBudget = Math.max(0, monthBudget - alloc.emergency - alloc.savings - alloc.buffer);

  const spent = monthExpenses.reduce(function(s, e) { return s + effectiveAmount(e); }, 0);
  const remaining = spendingBudget - spent;
  const perDay = daysLeft > 0 ? remaining / daysLeft : remaining;

  const todayExpenses = monthExpenses.filter(function(e) { return sameDay(new Date(e.created), now); });
  const spentToday = todayExpenses.reduce(function(s, e) { return s + effectiveAmount(e); }, 0);

  const monthName = now.toLocaleDateString(config.locale, { month: 'long', year: 'numeric' });

  return {
    monthName: monthName,
    monthKey: mk,
    monthBudget: monthBudget,
    monthExpenses: monthExpenses,
    spent: spent,
    remaining: remaining,
    perDay: perDay,
    daysLeft: daysLeft,
    spentToday: spentToday,
    spendingBudget: spendingBudget,
    setAside: alloc.emergency + alloc.savings + alloc.buffer,
    alloc: alloc,
    percent: spendingBudget > 0 ? Math.min(100, (spent / spendingBudget) * 100) : 0,
    over: spent > spendingBudget
  };
}

// ============ Export nudge ============
function shouldShowExportNudge() {
  if (expenses.length === 0) return false;

  const now = new Date();
  const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;
  const SEVEN_DAYS = 7 * 24 * 60 * 60 * 1000;

  if (!config.lastExportedAt) {
    if (expenses.length < 5) return false;
  } else {
    const last = new Date(config.lastExportedAt);
    if (now - last < THIRTY_DAYS) return false;
  }

  if (config.exportNudgeDismissedAt) {
    const dismissed = new Date(config.exportNudgeDismissedAt);
    if (now - dismissed < SEVEN_DAYS) return false;
  }

  return true;
}

function renderExportNudge() {
  const el = document.getElementById('exportNudge');
  if (!el) return;
  el.hidden = !shouldShowExportNudge();
}

function doExport() {
  const payload = { expenses: expenses, config: config };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'spend-' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);

  config.lastExportedAt = new Date().toISOString();
  saveConfig();
  renderExportNudge();
}

// ============ Render: expense list ============
function renderExpenseList() {
  const el = document.getElementById('expenseList');
  if (expenses.length === 0) {
    el.innerHTML = '<div class="empty">No expenses yet.</div>';
    return;
  }
  const sorted = expenses.slice().sort(function(a, b) {
    return new Date(b.created) - new Date(a.created);
  });
  const groups = new Map();
  for (const e of sorted) {
    const key = new Date(e.created).toDateString();
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(e);
  }
  let html = '';
  for (const entry of groups) {
    const list = entry[1];
    const dayTotal = list.reduce(function(s, e) { return s + effectiveAmount(e); }, 0);
    const d = new Date(list[0].created);
    html += '<div class="day-group">'
      + '<div class="day-label">'
      +   '<span>' + escapeHtml(dayLabel(d)) + '</span>'
      +   '<span class="day-total">' + escapeHtml(config.currency) + fmt(dayTotal) + '</span>'
      + '</div>'
      + '<div class="expenses-list">';
    for (const e of list) {
      const color = CAT_COLOR[e.category] || CAT_COLOR.Other;
      const share = effectiveAmount(e);
      const showSplit = (e.split || 1) > 1;
      const noteText = e.note
        ? escapeHtml(e.note)
        : (showSplit ? 'Split ' + e.split + ' ways' : '');
      html += '<div class="exp" data-id="' + e.id + '">'
        + '<span class="dot" style="background:' + color + '"></span>'
        + '<div class="exp-body">'
        +   '<div class="exp-cat">' + escapeHtml(e.category) + '</div>'
        +   (noteText ? '<div class="exp-note">' + noteText + '</div>' : '')
        + '</div>'
        + '<div class="exp-amount">' + escapeHtml(config.currency) + fmt(share) + '</div>'
        + '<button class="exp-delete" data-del="' + e.id + '" aria-label="Delete">\u00D7</button>'
        + '</div>';
    }
    html += '</div></div>';
  }
  el.innerHTML = html;
  el.querySelectorAll('[data-del]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const id = btn.dataset.del;
      expenses = expenses.filter(function(e) { return e.id !== id; });
      save();
      renderAll();
    });
  });
}

// ============ Render: wallet ============
function renderWallet() {
  const el = document.getElementById('walletTab');
  const balance = walletBalance();
  const mk = monthKey();
  const monthName = new Date().toLocaleDateString(config.locale, { month: 'long' });
  const allottedThisMonth = walletAllottedToMonth(mk);

  let historyHtml = '';
  const list = (config.wallet || []).slice().sort(function(a, b) {
    return new Date(b.created) - new Date(a.created);
  });
  if (list.length === 0) {
    historyHtml = '<div class="empty" style="padding:30px 20px">No wallet activity yet.<br>Add money when you get paid, then allot it to your budget.</div>';
  } else {
    const groups = new Map();
    for (const t of list) {
      const key = new Date(t.created).toDateString();
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(t);
    }
    for (const entry of groups) {
      const dayList = entry[1];
      const d = new Date(dayList[0].created);
      historyHtml += '<div class="day-group">'
        + '<div class="day-label"><span>' + escapeHtml(dayLabel(d)) + '</span></div>'
        + '<div class="expenses-list">';
      for (const t of dayList) {
        const isPositive = (t.type === 'in' || t.type === 'refund');
        const sign = isPositive ? '+' : '\u2212';
        const cls = isPositive ? 'pos' : 'neg';
        const label = t.note || defaultWalletLabel(t);
        historyHtml += '<div class="exp">'
          + '<div class="exp-body"><div class="exp-cat">' + escapeHtml(label) + '</div>'
          + (t.month ? '<div class="exp-note">' + escapeHtml(monthLabelFromKey(t.month)) + '</div>' : '')
          + '</div>'
          + '<div class="exp-amount ' + cls + '">' + sign + escapeHtml(config.currency) + fmt(t.amount) + '</div>'
          + '<button class="exp-delete" data-wdel="' + t.id + '" aria-label="Delete">\u00D7</button>'
          + '</div>';
      }
      historyHtml += '</div></div>';
    }
  }

  el.innerHTML =
    '<div class="wallet-card">'
    + '<div class="wallet-label">In wallet</div>'
    + '<div class="wallet-balance"><span class="cur">' + escapeHtml(config.currency) + '</span>' + fmt(Math.max(0, balance)) + '</div>'
    + '<div class="wallet-sub">Available to allot or keep</div>'
    + '<div class="wallet-actions">'
    +   '<button class="primary" id="addMoneyBtn">Add money</button>'
    +   '<button class="secondary" id="allotBtn">Allot</button>'
    + '</div>'
    + '</div>'
    + '<div class="wallet-stat-row">'
    +   '<div class="wallet-stat"><div class="wallet-stat-label">Allotted ' + escapeHtml(monthName) + '</div>'
    +     '<div class="wallet-stat-value">' + escapeHtml(config.currency) + fmt(allottedThisMonth) + '</div></div>'
    +   '<div class="wallet-stat"><div class="wallet-stat-label">' + escapeHtml(monthName) + ' budget</div>'
    +     '<div class="wallet-stat-value">' + escapeHtml(config.currency) + fmt(budgetForMonth(mk)) + '</div></div>'
    + '</div>'
    + historyHtml;

  document.getElementById('addMoneyBtn').addEventListener('click', openAddMoney);
  document.getElementById('allotBtn').addEventListener('click', openAllot);
  el.querySelectorAll('[data-wdel]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      const id = btn.dataset.wdel;
      if (!confirm('Delete this wallet entry? The budget will adjust accordingly.')) return;
      config.wallet = (config.wallet || []).filter(function(t) { return t.id !== id; });
      saveConfig();
      renderAll();
    });
  });
}

function defaultWalletLabel(t) {
  if (t.type === 'in') return 'Money in';
  if (t.type === 'out') return 'Money out';
  if (t.type === 'allot') return 'Allotted to budget';
  if (t.type === 'refund') return 'Refunded from budget';
  return 'Entry';
}
function monthLabelFromKey(mk) {
  const parts = mk.split('-');
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1, 1);
  return d.toLocaleDateString(config.locale, { month: 'long', year: 'numeric' });
}

// ============ Render: week ============
function renderWeek() {
  const el = document.getElementById('weekTab');
  const r = resolveWeeklyBudget();
  const weeklyBudget = r.amount;
  const source = r.source;

  const ws = startOfWeek();
  const we = endOfWeek();

  const weekExpenses = expenses.filter(function(e) {
    const d = new Date(e.created);
    return d >= ws && d <= we;
  });
  const weekSpent = weekExpenses.reduce(function(s, e) { return s + effectiveAmount(e); }, 0);
  const weekRemaining = weeklyBudget - weekSpent;
  const pct = weeklyBudget > 0 ? Math.min(100, (weekSpent / weeklyBudget) * 100) : 0;
  const over = weekSpent > weeklyBudget;

  const rangeStr = ws.toLocaleDateString(config.locale, { month: 'short', day: 'numeric' })
    + ' \u2013 ' + we.toLocaleDateString(config.locale, { month: 'short', day: 'numeric' });

  const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const startsMonday = config.weekStartsMonday;
  const todayKey = new Date().toDateString();
  const dayTotals = [];
  let maxDay = 1;
  for (let i = 0; i < 7; i++) {
    const d = new Date(ws);
    d.setDate(d.getDate() + i);
    const dayExp = weekExpenses.filter(function(e) {
      return new Date(e.created).toDateString() === d.toDateString();
    });
    const total = dayExp.reduce(function(s, e) { return s + effectiveAmount(e); }, 0);
    if (total > maxDay) maxDay = total;
    dayTotals.push({
      date: d,
      label: dayNames[startsMonday ? i : (i + 6) % 7],
      total: total,
      isToday: d.toDateString() === todayKey,
      isFuture: d > new Date()
    });
  }

  let daysHtml = '';
  for (const d of dayTotals) {
    const barPct = maxDay > 0 ? (d.total / maxDay) * 100 : 0;
    daysHtml += '<div class="week-day' + (d.isToday ? ' today' : '') + '">'
      + '<span class="week-day-name">' + d.label + '</span>'
      + '<div class="week-day-bar"><div class="week-day-bar-fill" style="width:' + barPct + '%"></div></div>'
      + '<span class="week-day-amt">' + (d.isFuture ? '\u2014' : escapeHtml(config.currency) + fmt(d.total)) + '</span>'
      + '</div>';
  }

  let sourceNote;
  if (source === 'set') {
    sourceNote = 'Weekly budget is set independently in Settings. '
      + 'The monthly budget still applies overall \u2014 this is a separate pace to hold yourself to.';
  } else {
    sourceNote = 'Weekly budget is this month\u2019s spending budget spread across 7 days. '
      + 'Set an explicit weekly budget in Settings if you want a fixed number.';
  }

  el.innerHTML =
    '<div class="week-card">'
    + '<div class="week-header">'
    +   '<div class="week-label">This week</div>'
    +   '<div class="week-range">' + escapeHtml(rangeStr) + '</div>'
    + '</div>'
    + '<div class="week-amount"><span class="cur">' + escapeHtml(config.currency) + '</span>' + fmt(Math.max(0, weekRemaining)) + '</div>'
    + '<div class="week-sub">' + (over ? 'over for this week' : 'left for this week') + '</div>'
    + '<div class="week-progress"><div class="week-progress-fill' + (over ? ' over' : '') + '" style="width:' + pct + '%"></div></div>'
    + '<div class="week-meta">'
    +   '<span class="week-meta-label">Weekly budget ' + escapeHtml(config.currency) + fmt(weeklyBudget) + '</span>'
    +   '<span class="week-meta-value">Spent ' + escapeHtml(config.currency) + fmt(weekSpent) + '</span>'
    + '</div>'
    + '</div>'
    + '<div class="bd-title" style="margin:0 4px 10px">Days this week</div>'
    + '<div class="week-days">' + daysHtml + '</div>'
    + '<div class="bucket-note" style="margin-top:14px">' + sourceNote + '</div>';
}

  document.getElementById('addBtn').disabled = v <= 0;

function addExpense() {
  if (config.budget <= 0) return;
  const amtInput = document.getElementById('amountInput');
  const noteInput = document.getElementById('noteInput');
  const splitToggle = document.getElementById('splitToggle');
  const splitCountInput = document.getElementById('splitCount');

  const amount = parseFloat(String(amtInput.value).replace(/,/g, '')) || 0;
  if (amount <= 0) return;

  const split = splitToggle.checked
    ? Math.max(2, parseInt(splitCountInput.value, 10) || 2)
    : 1;

  expenses.push({
    id: uid(), amount: amount, category: selectedCategory,
    note: noteInput.value.trim(), split: split,
    created: new Date().toISOString()
  });
  save();
  Store.set(LASTCAT_KEY, selectedCategory);

  amtInput.value = '';
  noteInput.value = '';
  splitToggle.checked = false;
  splitCountInput.value = 2;
  splitCountInput.hidden = true;
  document.getElementById('splitInfo').hidden = true;

  updateAddButton();
  renderAll();
  amtInput.focus();
}
function updateSplitInfo() {
  const amtInput = document.getElementById('amountInput');
  const splitToggle = document.getElementById('splitToggle');
  const splitCountInput = document.getElementById('splitCount');
  const infoEl = document.getElementById('splitInfo');
  splitCountInput.hidden = !splitToggle.checked;
  if (!splitToggle.checked) { infoEl.hidden = true; return; }
  const amount = parseFloat(String(amtInput.value).replace(/,/g, '')) || 0;
  const n = Math.max(2, parseInt(splitCountInput.value, 10) || 2);
  if (amount <= 0) { infoEl.hidden = true; return; }
  infoEl.hidden = false;
  infoEl.textContent = 'Your share: ' + config.currency + fmt(amount / n);
}

    +   '<input type="text" inputmode="decimal" id="sBudget" value="' + (config.budget || '') + '" autocomplete="off"></div>'

    +   '<select id="sCurrency">' + currencyOptions + '</select></div>'
    + '<div class="bd-title" style="margin-top:20px;margin-bottom:10px">Set aside</div>'
    + '<div class="field-row">'
    +   '<div class="field"><label>Emergency %</label>'
    +     '<input type="number" id="sEmergency" min="0" max="100" value="' + (a.emergency || 0) + '"></div>'
    +   '<div class="field"><label>Savings %</label>'
    +     '<input type="number" id="sSavings" min="0" max="100" value="' + (a.savings || 0) + '"></div>'
    +   '<div class="field"><label>Buffer %</label>'
    +     '<input type="number" id="sBuffer" min="0" max="100" value="' + (a.buffer || 0) + '"></div>'
    + '</div>'
    + '<div class="allocation-summary" id="allocSummary"></div>'
    + '<div class="bd-title" style="margin-top:20px;margin-bottom:10px">Weekly view</div>'
    + '<div class="field">'
    +   '<label style="display:flex;align-items:center;gap:10px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);cursor:pointer;">'
    +     '<input type="checkbox" id="sWeekly"' + (config.weeklyEnabled ? ' checked' : '') + ' style="width:16px;height:16px;accent-color:var(--dark)">'
    +     'Show Week tab'
    +   '</label>'
    + '</div>'
    + '<div class="field"><label for="sWeeklyBudget">Weekly budget (' + escapeHtml(config.currency) + ') \u2014 optional</label>'
    +   '<input type="text" inputmode="decimal" id="sWeeklyBudget" value="' + weeklyVal + '" placeholder="Leave blank to derive from monthly" autocomplete="off">'
    +   '<div class="field-hint">Set a fixed weekly number (like 200 from a 1000 monthly) to hold yourself to a pace. '
    +   'If blank, the Week tab spreads this month\u2019s spending budget across 7 days.</div>'
    + '</div>'
    + '<div class="modal-actions three">'
    +   '<button id="resetTotalsBtn">Reset accumulated totals</button>'
    +   '<button class="danger" id="exportBtn">Export</button>'
    +   '<button id="importBtn">Import</button>'
    + '</div>'
    + '<div class="modal-actions">'
    +   '<button class="danger" id="resetBtn">Reset all</button>'
    +   '<button class="primary" id="saveSettings">Save</button>'
    + '</div>'
    + '<input type="file" id="importFile" accept=".json" style="display:none">';

  modal.classList.add('show');

  function updateSummary() {
    const b = parseFloat(String(document.getElementById('sBudget').value).replace(/,/g, '')) || 0;
    const e = parseInt(document.getElementById('sEmergency').value, 10) || 0;
    const s = parseInt(document.getElementById('sSavings').value, 10) || 0;
    const f = parseInt(document.getElementById('sBuffer').value, 10) || 0;
    const total = e + s + f;
    const el = document.getElementById('allocSummary');
    if (b <= 0) { el.textContent = 'Set a budget to see how this splits.'; return; }
    const em = b * e / 100, sa = b * s / 100, bu = b * f / 100;
    const spending = b - em - sa - bu;
    if (total > 100) {
      el.innerHTML = '<span class="over">' + total + '% is more than 100%. Reduce the percentages.</span>';
    } else {
      el.innerHTML = config.currency + fmt(em) + ' emergency &middot; '
        + config.currency + fmt(sa) + ' savings &middot; '
        + config.currency + fmt(bu) + ' buffer<br>'
        + '<strong style="color:var(--ink)">' + config.currency + fmt(spending) + ' left to spend</strong> '
        + '(' + (100 - total) + '%)';
    }
  }

  ['sBudget','sEmergency','sSavings','sBuffer'].forEach(function(id) {
    document.getElementById(id).addEventListener('input', updateSummary);
  });
  updateSummary();

  document.getElementById('saveSettings').addEventListener('click', function() {
    const b = parseFloat(String(document.getElementById('sBudget').value).replace(/,/g, '')) || 0;
    const e = Math.max(0, Math.min(100, parseInt(document.getElementById('sEmergency').value, 10) || 0));
    const s = Math.max(0, Math.min(100, parseInt(document.getElementById('sSavings').value, 10) || 0));
    const f = Math.max(0, Math.min(100, parseInt(document.getElementById('sBuffer').value, 10) || 0));
    if (e + s + f > 100) {
      alert('Allocations add up to more than 100%. Reduce them.');
      return;
    }
    const cur = document.getElementById('sCurrency').value;
    const found = CURRENCIES.find(function(c) { return c.symbol === cur; });
    const wbRaw = String(document.getElementById('sWeeklyBudget').value).replace(/,/g, '').trim();
    const wb = wbRaw === '' ? 0 : Math.max(0, parseFloat(wbRaw) || 0);

    config.budget = b;
    config.currency = cur;
    config.locale = found ? found.locale : 'en-US';
    config.allocations = { emergency: e, savings: s, buffer: f };
    config.weeklyEnabled = document.getElementById('sWeekly').checked;
    config.weeklyBudget = wb;
    saveConfig();
    modal.classList.remove('show');
    if (!config.weeklyEnabled && window._currentTab === 'week') {
      window._currentTab = 'spend';
      switchTab('spend');
    }
    renderAll();
  });

  document.getElementById('resetTotalsBtn').addEventListener('click', function() {
    if (!confirm('Reset accumulated totals to zero? Your expenses and budget stay.')) return;
    config.totals = { emergency: 0, savings: 0, buffer: 0 };
    saveConfig();
    modal.classList.remove('show');
    renderAll();
  });

  document.getElementById('exportBtn').addEventListener('click', doExport);

  document.getElementById('importBtn').addEventListener('click', function() {
    document.getElementById('importFile').click();
  });
  document.getElementById('importFile').addEventListener('change', function(ev) {
    const f = ev.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = function() {
      try {
        const data = JSON.parse(reader.result);
        if (Array.isArray(data.expenses)) {
          const ids = new Set(expenses.map(function(e) { return e.id; }));
          for (const e of data.expenses) {
            if (e && e.id && !ids.has(e.id)) expenses.push(e);
          }
        }
        if (data.config && typeof data.config === 'object') {
          config = Object.assign({}, DEFAULT_CONFIG, data.config);
          config.allocations = Object.assign({}, DEFAULT_CONFIG.allocations, data.config.allocations || {});
          config.totals = Object.assign({}, DEFAULT_CONFIG.totals, data.config.totals || {});
          if (!Array.isArray(config.wallet)) config.wallet = [];
          if (typeof config.weeklyBudget !== 'number') config.weeklyBudget = 0;
          saveConfig();
        }
        save();
        modal.classList.remove('show');
        renderAll();
        alert('Imported.');
      } catch (err) {
        alert('Could not import: ' + err.message);
      }
      ev.target.value = '';
    };
    reader.readAsText(f);
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    if (!confirm('Delete all expenses, wallet entries, and reset settings? This cannot be undone.')) return;
    expenses = [];
    config = JSON.parse(JSON.stringify(DEFAULT_CONFIG));
    save();
    saveConfig();
    Store.remove(LASTCAT_KEY);
    modal.classList.remove('show');
    switchTab('spend');
    renderAll();
  });
}

  setTimeout(function() { input.focus(); }, 50);

  function apply(sign) {
    const v = parseFloat(String(input.value).replace(/,/g, '')) || 0;
    if (v <= 0) { input.focus(); return; }
    const next = Math.max(0, current + sign * v);
    config.totals[key] = next;
    saveConfig();
    modal.classList.remove('show');
    renderAll();
  }
  document.getElementById('depositBtn').addEventListener('click', function() { apply(1); });
  document.getElementById('withdrawBtn').addEventListener('click', function() { apply(-1); });
  document.getElementById('cancelBtn').addEventListener('click', function() {
    modal.classList.remove('show');
  });
  input.addEventListener('keydown', function(e) { if (e.key === 'Enter') apply(1); });
}

// ============ Tabs ============
function switchTab(name) {
  window._currentTab = name;
  document.querySelectorAll('.tab').forEach(function(x) {
    x.classList.toggle('active', x.dataset.tab === name);
  });
  document.getElementById('spendTab').hidden = name !== 'spend';
  document.getElementById('weekTab').hidden = name !== 'week';
  document.getElementById('monthTab').hidden = name !== 'month';
  document.getElementById('asideTab').hidden = name !== 'aside';
  document.getElementById('walletTab').hidden = name !== 'wallet';
  if (name === 'month') renderBreakdown();
  if (name === 'aside') renderAside();
  if (name === 'wallet') renderWallet();
  if (name === 'week') renderWeek();
}

// ============ Wire up ============
function setupInputs() {
  const amtInput = document.getElementById('amountInput');
  const splitToggle = document.getElementById('splitToggle');
  const splitCountInput = document.getElementById('splitCount');

  amtInput.addEventListener('input', function() {
    amtInput.value = amtInput.value.replace(/[^0-9.,]/g, '');
    updateAddButton();
    updateSplitInfo();
  });
  amtInput.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addExpense(); }
  });
  document.getElementById('noteInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') { e.preventDefault(); addExpense(); }
  });
  document.getElementById('addBtn').addEventListener('click', addExpense);
  splitToggle.addEventListener('change', updateSplitInfo);
  splitCountInput.addEventListener('input', updateSplitInfo);

  ['settingsModal','adjustModal','walletModal'].forEach(function(id) {
    document.getElementById(id).addEventListener('click', function(e) {
      if (e.target.id === id) e.target.classList.remove('show');
    });
  });
}

// ============ PWA install ============
function setupInstall() {
  const tip = document.getElementById('installTip');
  if (!tip) return;

  const isStandalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  if (isStandalone) return;
  if (Store.get(INSTALL_DISMISSED_KEY) === '1') return;

  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
  const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
  const installBtn = document.getElementById('installBtn');
  const installText = document.getElementById('installText');

  if (isIOS && isSafari) {
    installText.textContent = 'Install: tap Share, then Add to Home Screen';
    installBtn.hidden = true;
    tip.hidden = false;
    document.getElementById('installDismiss').addEventListener('click', function() {
      tip.hidden = true;
      Store.set(INSTALL_DISMISSED_KEY, '1');
    });
    return;
  }

  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredInstallPrompt = e;
    tip.hidden = false;
  });

  installBtn.addEventListener('click', function() {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    deferredInstallPrompt.userChoice.then(function() {
      deferredInstallPrompt = null;
      tip.hidden = true;
    });
  });
  document.getElementById('installDismiss').addEventListener('click', function() {
    tip.hidden = true;
    Store.set(INSTALL_DISMISSED_KEY, '1');
  });
  window.addEventListener('appinstalled', function() {
    tip.hidden = true;
    deferredInstallPrompt = null;
  });
}

function setupServiceWorker() {
  if (!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('sw.js').catch(function() {});
  });
}

function setupExportNudge() {
  const openBtn = document.getElementById('exportNudgeOpen');
  const dismissBtn = document.getElementById('exportNudgeDismiss');
  if (openBtn) {
    openBtn.addEventListener('click', function() {
      openSettings();
    });
  }
  if (dismissBtn) {
    dismissBtn.addEventListener('click', function() {
      config.exportNudgeDismissedAt = new Date().toISOString();
      saveConfig();
      renderExportNudge();
    });
  }
}

// ============ Init ============
try {
  load();
  rollMonth();
  setupInputs();
  setupInstall();
  setupServiceWorker();
  setupExportNudge();
  renderAll();
  switchTab('spend');
  if (config.budget > 0) {
    document.getElementById('amountInput').focus();
  }
} catch (err) {
  document.body.innerHTML =
    '<div style="max-width:480px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif">'
    + '<h2 style="color:#ef4444">Something went wrong</h2>'
    + '<p style="color:#71717a">Paste this in the browser console (F12) if you want help:</p>'
    + '<pre style="background:#f4f4f5;padding:14px;border-radius:8px;font-size:13px;overflow:auto">'
    + String(err && err.stack || err)
    + '</pre></div>';
  console.error(err);
}
</script>
